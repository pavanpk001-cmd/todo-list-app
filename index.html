<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskR - Todo List App</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="root"></div>
<canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const PRIORITIES = ["low", "medium", "high"];
const FILTERS = ["all", "active", "completed"];
const PRIORITY_META = {
  low:    { label: "Low",    color: "#4ade80", bg: "#052e16" },
  medium: { label: "Medium", color: "#facc15", bg: "#1c1400" },
  high:   { label: "High",   color: "#f87171", bg: "#2d0000" },
};

const GOOGLE_CLIENT_ID = "590104985713-me84mt6j5jl4m2dmn70rb13g2bg8l4p2.apps.googleusercontent.com";

// ── Confetti ──────────────────────────────────────────────────────────────────
function fireConfetti() {
  const canvas = document.getElementById("confetti-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ["#c8ff00", "#facc15", "#4ade80", "#f87171", "#60a5fa", "#e879f9"];
  const particles = Array.from({ length: 80 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 6 + 3,
    d: Math.random() * 60 + 20,
    color: colors[Math.floor(Math.random() * colors.length)],
    tilt: Math.random() * 10 - 10,
    tiltAngle: 0,
    tiltSpeed: Math.random() * 0.1 + 0.05,
  }));

  let frame = 0;
  const maxFrames = 120;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.tiltAngle += p.tiltSpeed;
      p.y += (Math.cos(frame / 20 + p.d) + 1.5) * 1.5;
      p.tilt = Math.sin(p.tiltAngle) * 12;
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
      ctx.stroke();
    });
    frame++;
    if (frame < maxFrames) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function formatDateTime(dateStr, timeStr) {
  if (!dateStr) return null;
  const d = new Date(timeStr ? `${dateStr}T${timeStr}` : `${dateStr}T00:00:00`);
  const datePart = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const timePart = timeStr ? d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true }) : null;
  return timePart ? `${datePart} at ${timePart}` : datePart;
}

function isOverdue(dateStr, timeStr) {
  if (!dateStr) return false;
  return new Date(timeStr ? `${dateStr}T${timeStr}` : `${dateStr}T23:59:59`) < new Date();
}

function parseJwt(token) {
  try {
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => `%${('00' + c.charCodeAt(0).toString(16)).slice(-2)}`).join('')));
  } catch { return null; }
}

function getStorageKey(uid) { return uid ? `tasks_${uid}` : 'tasks_guest'; }

// ── App ───────────────────────────────────────────────────────────────────────
function TodoApp() {
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem("taskr_user_info")) || null; } catch { return null; } });
  const [userId, setUserId] = useState(() => localStorage.getItem("taskr_user_id") || null);
  const [tasks, setTasks] = useState(() => {
    try {
      const uid = localStorage.getItem("taskr_user_id");
      const stored = localStorage.getItem(getStorageKey(uid));
      if (stored) return JSON.parse(stored);
      if (!uid) { const legacy = localStorage.getItem("tasks"); if (legacy) return JSON.parse(legacy); }
      return [];
    } catch { return []; }
  });
  const [input, setInput] = useState("");
  const [dueDate, setDueDate] = useState("");
  const [dueTime, setDueTime] = useState("");
  const [priority, setPriority] = useState("medium");
  const [filter, setFilter] = useState("all");
  const [priorityFilter, setPriorityFilter] = useState("all");
  const [editId, setEditId] = useState(null);
  const [editText, setEditText] = useState("");
  const [search, setSearch] = useState("");
  const [notificationPermission, setNotificationPermission] = useState(
    "Notification" in window ? Notification.permission : "unsupported"
  );
  // track which task ids are "entering" or "leaving" for animation
  const [enteringIds, setEnteringIds] = useState(new Set());
  const [leavingIds, setLeavingIds] = useState(new Set());

  useEffect(() => {
    try {
      const stored = localStorage.getItem(getStorageKey(userId));
      setTasks(stored ? JSON.parse(stored) : []);
    } catch { setTasks([]); }
  }, [userId]);

  useEffect(() => {
    const init = () => {
      if (!window.google?.accounts?.id) return;
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: (res) => {
          const payload = parseJwt(res.credential);
          if (!payload) return;
          const profile = { name: payload.name, email: payload.email, picture: payload.picture };
          setUser(profile); setUserId(payload.sub);
          localStorage.setItem("taskr_user_id", payload.sub);
          localStorage.setItem("taskr_user_info", JSON.stringify(profile));
        },
        ux_mode: "popup",
      });
      const btn = document.getElementById("googleSignInButton");
      if (btn) window.google.accounts.id.renderButton(btn, { theme: "outline", size: "large", text: "signin_with", shape: "rectangular" });
    };
    if (window.google?.accounts?.id) init();
    else { const iv = setInterval(() => { if (window.google?.accounts?.id) { clearInterval(iv); init(); } }, 250); return () => clearInterval(iv); }
  }, []);

  useEffect(() => { localStorage.setItem(getStorageKey(userId), JSON.stringify(tasks)); }, [tasks, userId]);

  useEffect(() => {
    if (notificationPermission !== "granted") return;
    const check = () => {
      tasks.filter(t => !t.completed && t.dueDate && isOverdue(t.dueDate, t.dueTime)).forEach(task => {
        const last = localStorage.getItem(`notified_${task.id}`);
        const now = Date.now();
        if (!last || now - parseInt(last) > 3600000) {
          new Notification("TaskR — Overdue Task!", { body: `"${task.text}" is overdue!`, tag: `overdue_${task.id}` });
          localStorage.setItem(`notified_${task.id}`, now.toString());
        }
      });
    };
    check();
    const iv = setInterval(check, 60000);
    return () => clearInterval(iv);
  }, [tasks, notificationPermission]);

  const signOut = () => {
    if (window.google?.accounts?.id) window.google.accounts.id.disableAutoSelect();
    setUser(null); setUserId(null);
    localStorage.removeItem("taskr_user_id"); localStorage.removeItem("taskr_user_info");
  };

  const addTask = () => {
    if (!input.trim()) return;
    const newTask = { id: Date.now(), text: input.trim(), completed: false, dueDate: dueDate || null, dueTime: dueTime || null, priority, createdAt: new Date().toISOString() };
    setEnteringIds(prev => new Set([...prev, newTask.id]));
    setTasks(prev => [newTask, ...prev]);
    setTimeout(() => setEnteringIds(prev => { const s = new Set(prev); s.delete(newTask.id); return s; }), 400);
    setInput(""); setDueDate(""); setDueTime(""); setPriority("medium");
  };

  const toggleTask = (id) => {
    const task = tasks.find(t => t.id === id);
    if (task && !task.completed) fireConfetti();
    setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
  };

  const deleteTask = (id) => {
    setLeavingIds(prev => new Set([...prev, id]));
    setTimeout(() => {
      setTasks(prev => prev.filter(t => t.id !== id));
      setLeavingIds(prev => { const s = new Set(prev); s.delete(id); return s; });
    }, 300);
  };

  const clearCompleted = () => {
    const completedIds = tasks.filter(t => t.completed).map(t => t.id);
    setLeavingIds(new Set(completedIds));
    setTimeout(() => {
      setTasks(prev => prev.filter(t => !t.completed));
      setLeavingIds(new Set());
    }, 300);
  };

  const saveEdit = id => {
    if (!editText.trim()) return;
    setTasks(tasks.map(t => t.id === id ? { ...t, text: editText.trim() } : t));
    setEditId(null); setEditText("");
  };

  const requestNotificationPermission = async () => {
    if (!("Notification" in window)) return;
    setNotificationPermission(await Notification.requestPermission());
  };

  const overdueCount = tasks.filter(t => !t.completed && t.dueDate && isOverdue(t.dueDate, t.dueTime)).length;
  const completedCount = tasks.filter(t => t.completed).length;
  const activeCount = tasks.filter(t => !t.completed).length;

  const filteredTasks = tasks.filter(t => {
    const statusMatch = filter === "all" ? true : filter === "active" ? !t.completed : t.completed;
    const priorityMatch = priorityFilter === "all" ? true : t.priority === priorityFilter;
    const searchMatch = search.trim() === "" ? true : t.text.toLowerCase().includes(search.toLowerCase());
    return statusMatch && priorityMatch && searchMatch;
  });

  return (
    <div style={styles.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::placeholder { color: #444; }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
        .task-row { transition: transform 0.15s ease, background 0.15s ease, opacity 0.3s ease, max-height 0.3s ease; }
        .task-row:hover { transform: translateX(3px); background: #161616 !important; }
        .task-entering { animation: slideIn 0.35s cubic-bezier(0.22,1,0.36,1) forwards; }
        .task-leaving { animation: slideOut 0.3s ease forwards; }
        @keyframes slideIn {
          from { opacity: 0; transform: translateY(-12px) scale(0.97); }
          to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes slideOut {
          from { opacity: 1; transform: translateX(0); max-height: 80px; }
          to   { opacity: 0; transform: translateX(40px); max-height: 0; padding: 0; margin: 0; }
        }
        .del-btn { opacity: 0; transition: opacity 0.15s ease; }
        .task-row:hover .del-btn { opacity: 1; }
        .add-btn:hover { background: #e2ff5d !important; }
        .filter-btn:hover { background: #1e1e1e !important; }
        .checkbox { cursor: pointer; transition: transform 0.1s, background 0.2s; }
        .checkbox:hover { transform: scale(1.2); }
        input, select { outline: none; }
        input:focus { border-color: #c8ff00 !important; }
        .sign-out-btn:hover { border-color: #c8ff00 !important; color: #c8ff00 !important; }
        .search-wrap { position: relative; }
        .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; }
        .clear-search { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #555; cursor: pointer; font-size: 13px; padding: 2px 4px; }
        .clear-search:hover { color: #c8ff00; }
        .overdue-badge { background: #2d0000; color: #f87171; border: 1px solid #5f1a1a; font-family: 'DM Mono', monospace; font-size: 11px; padding: 3px 9px; border-radius: 99px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
      `}</style>

      <div style={styles.container}>
        {/* Header */}
        <div style={styles.header}>
          <div style={styles.headerTop}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={styles.logo}>✦ TASKR</span>
              {overdueCount > 0 && (
                <span className="overdue-badge">⚠ {overdueCount} overdue</span>
              )}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              {user ? (
                <>
                  <img src={user.picture} alt={user.name} style={styles.avatar} />
                  <span style={styles.userName}>{user.name}</span>
                  <button className="sign-out-btn" style={styles.signOutBtn} onClick={signOut}>Sign out</button>
                </>
              ) : <div id="googleSignInButton" />}
              {notificationPermission === "granted" && (
                <span style={{ ...styles.chip, background: "#1a5f1a", color: "#4ade80" }}>🔔 ON</span>
              )}
              <span style={styles.chip}>{activeCount} left · {completedCount} done</span>
            </div>
          </div>
          <p style={styles.subheading}>Stay sharp. Get it done.</p>
          {user && <p style={{ ...styles.subheading, color: "#2a4a00", marginTop: 3, fontSize: 11 }}>✦ Saved to {user.email}</p>}
        </div>

        {/* Add Task Form */}
        <div style={styles.form}>
          <div style={styles.inputRow}>
            <input style={styles.mainInput} placeholder="What needs to get done?" value={input}
              onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && addTask()} />
            <button style={styles.addBtn} className="add-btn" onClick={addTask}>+ Add</button>
          </div>
          <div style={styles.metaRow}>
            <div style={{ display: "flex", gap: 8 }}>
              <input type="date" style={styles.dateInput} value={dueDate} onChange={e => setDueDate(e.target.value)} />
              <input type="time" style={styles.timeInput} value={dueTime} onChange={e => setDueTime(e.target.value)} />
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              {PRIORITIES.map(p => (
                <button key={p} onClick={() => setPriority(p)} style={{
                  ...styles.priorityBtn,
                  background: priority === p ? PRIORITY_META[p].color : "#111",
                  color: priority === p ? "#000" : "#555",
                  borderColor: priority === p ? PRIORITY_META[p].color : "#222",
                }}>{PRIORITY_META[p].label}</button>
              ))}
            </div>
          </div>
        </div>

        {/* Notification Banner */}
        {notificationPermission === "default" && (
          <div style={styles.notifBanner}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 18 }}>🔔</span>
              <div>
                <p style={{ margin: 0, fontWeight: 600, color: "#c8ff00", fontSize: 13 }}>Enable Task Reminders</p>
                <p style={{ margin: 0, fontSize: 11, color: "#999" }}>Get notified when tasks become overdue</p>
              </div>
            </div>
            <button onClick={requestNotificationPermission} style={styles.notifBtn}>Enable</button>
          </div>
        )}

        {/* Search + Filters */}
        <div style={{ marginBottom: 12 }}>
          <div className="search-wrap" style={{ marginBottom: 10 }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#444" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              style={{ ...styles.mainInput, paddingLeft: 32, fontSize: 13, padding: "8px 32px 8px 32px" }}
              placeholder="Search tasks..."
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
            {search && <button className="clear-search" onClick={() => setSearch("")}>✕</button>}
          </div>

          <div style={styles.filters}>
            <div style={{ display: "flex", gap: 2 }}>
              {FILTERS.map(f => (
                <button key={f} className="filter-btn" onClick={() => setFilter(f)} style={{
                  ...styles.filterBtn,
                  background: filter === f ? "#1e1e1e" : "transparent",
                  color: filter === f ? "#c8ff00" : "#555",
                  borderBottom: filter === f ? "2px solid #c8ff00" : "2px solid transparent",
                }}>{f.charAt(0).toUpperCase() + f.slice(1)}</button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 2 }}>
              {["all", ...PRIORITIES].map(p => (
                <button key={p} className="filter-btn" onClick={() => setPriorityFilter(p)} style={{
                  ...styles.filterBtn, fontSize: 11,
                  color: priorityFilter === p ? (p === "all" ? "#c8ff00" : PRIORITY_META[p].color) : "#444",
                  background: priorityFilter === p ? "#1a1a1a" : "transparent",
                  borderBottom: priorityFilter === p ? `2px solid ${p === "all" ? "#c8ff00" : PRIORITY_META[p].color}` : "2px solid transparent",
                }}>{p === "all" ? "All" : PRIORITY_META[p].label}</button>
              ))}
            </div>
          </div>
        </div>

        {/* Task List */}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {filteredTasks.length === 0 && (
            <div style={styles.empty}>
              <span style={{ fontSize: 28 }}>✦</span>
              <p style={{ color: "#333", fontFamily: "'DM Mono', monospace", fontSize: 12 }}>
                {search ? `No tasks matching "${search}"` : "No tasks here. Add one above."}
              </p>
            </div>
          )}
          {filteredTasks.map(task => {
            const meta = PRIORITY_META[task.priority];
            const overdue = !task.completed && isOverdue(task.dueDate, task.dueTime);
            const isEntering = enteringIds.has(task.id);
            const isLeaving = leavingIds.has(task.id);
            return (
              <div key={task.id}
                className={`task-row${isEntering ? " task-entering" : ""}${isLeaving ? " task-leaving" : ""}`}
                style={styles.taskRow}>
                <div style={{ width: 3, background: meta.color, borderRadius: 2, flexShrink: 0, alignSelf: "stretch" }} />
                <div className="checkbox" onClick={() => toggleTask(task.id)} style={{
                  ...styles.checkbox,
                  background: task.completed ? "#c8ff00" : "transparent",
                  borderColor: task.completed ? "#c8ff00" : "#333",
                }}>
                  {task.completed && <span style={{ color: "#000", fontSize: 11, fontWeight: 800 }}>✓</span>}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  {editId === task.id ? (
                    <input style={styles.editInput} value={editText} autoFocus
                      onChange={e => setEditText(e.target.value)}
                      onKeyDown={e => { if (e.key === "Enter") saveEdit(task.id); if (e.key === "Escape") setEditId(null); }} />
                  ) : (
                    <p onDoubleClick={() => { setEditId(task.id); setEditText(task.text); }}
                      style={{ ...styles.taskText, textDecoration: task.completed ? "line-through" : "none", color: task.completed ? "#444" : "#e0e0e0" }}>
                      {task.text}
                    </p>
                  )}
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <span style={{ ...styles.priorityTag, color: meta.color, background: meta.bg }}>{meta.label}</span>
                    {task.dueDate && (
                      <span style={{ fontSize: 11, fontFamily: "'DM Mono', monospace", color: overdue ? "#f87171" : "#666" }}>
                        {overdue ? "⚠ " : ""}{formatDateTime(task.dueDate, task.dueTime)}
                      </span>
                    )}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                  {editId === task.id
                    ? <button style={styles.saveBtn} onClick={() => saveEdit(task.id)}>Save</button>
                    : <button className="del-btn" style={styles.editBtn} onClick={() => { setEditId(task.id); setEditText(task.text); }}>✎</button>
                  }
                  <button className="del-btn" style={styles.deleteBtn} onClick={() => deleteTask(task.id)}>✕</button>
                </div>
              </div>
            );
          })}
        </div>

        {completedCount > 0 && (
          <div style={{ marginTop: 16, display: "flex", justifyContent: "flex-end" }}>
            <button style={styles.clearBtn} onClick={clearCompleted}>Clear {completedCount} completed</button>
          </div>
        )}
      </div>
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", background: "#0a0a0a", display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "40px 16px 80px", fontFamily: "'Syne', sans-serif" },
  container: { width: "100%", maxWidth: 620 },
  header: { marginBottom: 28 },
  headerTop: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6, flexWrap: "wrap", gap: 8 },
  logo: { fontSize: 26, fontWeight: 800, color: "#c8ff00", letterSpacing: "0.05em" },
  chip: { fontFamily: "'DM Mono', monospace", fontSize: 11, color: "#555", background: "#111", padding: "3px 9px", borderRadius: 99, border: "1px solid #1e1e1e" },
  avatar: { width: 26, height: 26, borderRadius: "50%", border: "1px solid #333", objectFit: "cover" },
  userName: { color: "#c8ff00", fontFamily: "'DM Mono', monospace", fontSize: 12 },
  signOutBtn: { background: "transparent", border: "1px solid #333", color: "#666", padding: "4px 9px", borderRadius: 6, fontFamily: "'DM Mono', monospace", fontSize: 11, cursor: "pointer", transition: "all 0.15s" },
  subheading: { fontFamily: "'DM Mono', monospace", fontSize: 12, color: "#3a3a3a", letterSpacing: "0.05em" },
  form: { background: "#111", border: "1px solid #1e1e1e", borderRadius: 12, padding: 14, marginBottom: 14, display: "flex", flexDirection: "column", gap: 10 },
  inputRow: { display: "flex", gap: 8 },
  mainInput: { flex: 1, background: "#0a0a0a", border: "1px solid #222", borderRadius: 8, padding: "9px 13px", color: "#e0e0e0", fontSize: 14, fontFamily: "'Syne', sans-serif", transition: "border-color 0.2s", width: "100%" },
  addBtn: { background: "#c8ff00", color: "#000", border: "none", borderRadius: 8, padding: "9px 16px", fontFamily: "'Syne', sans-serif", fontWeight: 700, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap", transition: "background 0.15s" },
  metaRow: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" },
  dateInput: { background: "#0a0a0a", border: "1px solid #222", borderRadius: 8, padding: "6px 10px", color: "#888", fontSize: 12, fontFamily: "'DM Mono', monospace", cursor: "pointer", transition: "border-color 0.2s" },
  timeInput: { background: "#0a0a0a", border: "1px solid #222", borderRadius: 8, padding: "6px 10px", color: "#888", fontSize: 12, fontFamily: "'DM Mono', monospace", cursor: "pointer", transition: "border-color 0.2s" },
  priorityBtn: { border: "1px solid", borderRadius: 6, padding: "5px 10px", fontSize: 11, fontFamily: "'DM Mono', monospace", fontWeight: 500, cursor: "pointer", transition: "all 0.15s" },
  notifBanner: { background: "#111", border: "1px solid #2a2a00", borderRadius: 10, padding: "10px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" },
  notifBtn: { background: "#c8ff00", color: "#000", border: "none", borderRadius: 6, padding: "6px 12px", fontFamily: "'DM Mono', monospace", fontWeight: 600, fontSize: 11, cursor: "pointer" },
  filters: { display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6, paddingBottom: 10, borderBottom: "1px solid #141414" },
