<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskR - Todo List App</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const PRIORITIES = ["low", "medium", "high"];
const FILTERS = ["all", "active", "completed"];

const PRIORITY_META = {
  low:    { label: "Low",    color: "#4ade80", bg: "#052e16" },
  medium: { label: "Medium", color: "#facc15", bg: "#1c1400" },
  high:   { label: "High",   color: "#f87171", bg: "#2d0000" },
};

// ── helpers ──────────────────────────────────────────────────────────────────

function formatDateTime(dateStr, timeStr) {
  if (!dateStr) return null;
  const d = new Date(timeStr ? `${dateStr}T${timeStr}` : `${dateStr}T00:00:00`);
  const datePart = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  if (!timeStr) return datePart;
  const timePart = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
  return `${datePart} at ${timePart}`;
}

function isOverdue(dateStr, timeStr) {
  if (!dateStr) return false;
  const due = new Date(timeStr ? `${dateStr}T${timeStr}` : `${dateStr}T23:59:59`);
  return due < new Date();
}

function loadTasks() {
  try {
    const stored = localStorage.getItem("taskr_tasks");
    if (stored) return JSON.parse(stored);
  } catch {}
  return [];
}

function saveTasks(tasks) {
  try { localStorage.setItem("taskr_tasks", JSON.stringify(tasks)); } catch {}
}

// ── component ─────────────────────────────────────────────────────────────────

function TodoApp() {
  const [tasks,          setTasksRaw]     = useState(loadTasks);
  const [input,          setInput]         = useState("");
  const [dueDate,        setDueDate]       = useState("");
  const [dueTime,        setDueTime]       = useState("");
  const [priority,       setPriority]      = useState("medium");
  const [filter,         setFilter]        = useState("all");
  const [priorityFilter, setPriorityFilter] = useState("all");
  const [editId,         setEditId]        = useState(null);
  const [editText,       setEditText]      = useState("");
  const [notifPerm,      setNotifPerm]     = useState(
    typeof Notification !== "undefined" ? Notification.permission : "denied"
  );

  // persist on every change
  const setTasks = useCallback((updater) => {
    setTasksRaw(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      saveTasks(next);
      return next;
    });
  }, []);

  // request notification permission on mount
  useEffect(() => {
    if (typeof Notification === "undefined") return;
    if (Notification.permission === "default") {
      Notification.requestPermission().then(p => setNotifPerm(p));
    }
  }, []);

  // overdue notification checker
  useEffect(() => {
    if (notifPerm !== "granted") return;
    const check = () => {
      const now = Date.now();
      tasks.forEach(task => {
        if (task.completed || !isOverdue(task.dueDate, task.dueTime)) return;
        const key = `taskr_notified_${task.id}`;
        const last = Number(localStorage.getItem(key) || 0);
        if (now - last < 60 * 60 * 1000) return; // once per hour
        try {
          new Notification("TaskR — Overdue Task!", {
            body: `"${task.text}" is overdue!`,
            tag: `overdue_${task.id}`,
          });
          localStorage.setItem(key, String(now));
        } catch {}
      });
    };
    check();
    const id = setInterval(check, 60_000);
    return () => clearInterval(id);
  }, [tasks, notifPerm]);

  // ── actions ──────────────────────────────────────────────────────────────

  const addTask = () => {
    const text = input.trim();
    if (!text) return;
    setTasks(prev => [{
      id:        Date.now(),
      text,
      completed: false,
      dueDate:   dueDate || null,
      dueTime:   dueTime || null,
      priority,
      createdAt: new Date().toISOString(),
    }, ...prev]);
    setInput(""); setDueDate(""); setDueTime(""); setPriority("medium");
  };

  const toggleTask = id =>
    setTasks(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t));

  const deleteTask = id =>
    setTasks(prev => prev.filter(t => t.id !== id));

  const clearCompleted = () =>
    setTasks(prev => prev.filter(t => !t.completed));

  const saveEdit = id => {
    if (!editText.trim()) return;
    setTasks(prev => prev.map(t => t.id === id ? { ...t, text: editText.trim() } : t));
    setEditId(null); setEditText("");
  };

  const requestNotif = async () => {
    if (typeof Notification === "undefined") return;
    const p = await Notification.requestPermission();
    setNotifPerm(p);
  };

  // ── derived ──────────────────────────────────────────────────────────────

  const filtered = tasks.filter(t => {
    const statusOk   = filter === "all" ? true : filter === "active" ? !t.completed : t.completed;
    const priorityOk = priorityFilter === "all" ? true : t.priority === priorityFilter;
    return statusOk && priorityOk;
  });

  const completedCount = tasks.filter(t => t.completed).length;
  const activeCount    = tasks.filter(t => !t.completed).length;

  // ── render ────────────────────────────────────────────────────────────────

  return (
    <div style={s.page}>
      <style>{`
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; }
        ::placeholder { color: #444; }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
        .task-row { transition: transform 0.15s ease, background 0.15s ease; }
        .task-row:hover { transform: translateX(3px); background: #161616 !important; }
        .del-btn { opacity: 0; transition: opacity 0.15s ease; }
        .task-row:hover .del-btn { opacity: 1; }
        .add-btn:hover { background: #e2ff5d !important; }
        .filter-btn:hover { background: #1e1e1e !important; }
        .checkbox { cursor: pointer; transition: transform 0.1s; }
        .checkbox:hover { transform: scale(1.15); }
        input:focus, select:focus { outline: none; border-color: #c8ff00 !important; }
        .clear-btn:hover { border-color: #555 !important; color: #999 !important; }
      `}</style>

      <div style={s.container}>

        {/* ── Header ── */}
        <div style={s.header}>
          <div style={s.headerTop}>
            <span style={s.logo}>✦ TASKR</span>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
              {notifPerm === "granted" && (
                <span style={{ ...s.chip, background:"#1a5f1a", color:"#4ade80" }}>🔔 Notifications ON</span>
              )}
              {notifPerm === "denied" && (
                <span style={{ ...s.chip, background:"#5f1a1a", color:"#f87171" }}>🔕 Notifications OFF</span>
              )}
              <span style={s.chip}>{activeCount} left · {completedCount} done</span>
            </div>
          </div>
          <p style={s.sub}>Stay sharp. Get it done.</p>
        </div>

        {/* ── Notification Banner ── */}
        {notifPerm === "default" && (
          <div style={s.notifBanner}>
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              <span style={{ fontSize:20 }}>🔔</span>
              <div>
                <p style={{ margin:0, fontWeight:600, color:"#c8ff00" }}>Enable Task Reminders</p>
                <p style={{ margin:0, fontSize:12, color:"#ccc" }}>Get notified when tasks become overdue</p>
              </div>
            </div>
            <button onClick={requestNotif} style={s.enableBtn}>Enable Notifications</button>
          </div>
        )}

        {/* ── Add Task Form ── */}
        <div style={s.form}>
          <div style={{ display:"flex", gap:10 }}>
            <input
              style={s.mainInput}
              placeholder="What needs to get done?"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && addTask()}
            />
            <button style={s.addBtn} className="add-btn" onClick={addTask}>+ Add</button>
          </div>

          <div style={{ display:"flex", gap:12, alignItems:"center", flexWrap:"wrap" }}>
            <div style={{ display:"flex", gap:8 }}>
              <input
                type="date"
                style={s.dateInput}
                value={dueDate}
                onChange={e => setDueDate(e.target.value)}
              />
              <input
                type="time"
                style={s.dateInput}
                value={dueTime}
                onChange={e => setDueTime(e.target.value)}
                disabled={!dueDate}
              />
            </div>
            <div style={{ display:"flex", gap:6 }}>
              {PRIORITIES.map(p => (
                <button
                  key={p}
                  onClick={() => setPriority(p)}
                  style={{
                    ...s.priorityBtn,
                    background:   priority === p ? PRIORITY_META[p].color : "#111",
                    color:        priority === p ? "#000" : "#555",
                    borderColor:  priority === p ? PRIORITY_META[p].color : "#222",
                  }}
                >{PRIORITY_META[p].label}</button>
              ))}
            </div>
          </div>
        </div>

        {/* ── Filters ── */}
        <div style={s.filters}>
          <div style={{ display:"flex", gap:2 }}>
            {FILTERS.map(f => (
              <button
                key={f}
                className="filter-btn"
                onClick={() => setFilter(f)}
                style={{
                  ...s.filterBtn,
                  background:   filter === f ? "#1e1e1e" : "transparent",
                  color:        filter === f ? "#c8ff00" : "#555",
                  borderBottom: filter === f ? "2px solid #c8ff00" : "2px solid transparent",
                }}
              >{f.charAt(0).toUpperCase() + f.slice(1)}</button>
            ))}
          </div>
          <div style={{ display:"flex", gap:2 }}>
            {["all", ...PRIORITIES].map(p => (
              <button
                key={p}
                className="filter-btn"
                onClick={() => setPriorityFilter(p)}
                style={{
                  ...s.filterBtn,
                  fontSize:     11,
                  color:        priorityFilter === p ? (p === "all" ? "#c8ff00" : PRIORITY_META[p].color) : "#444",
                  background:   priorityFilter === p ? "#1a1a1a" : "transparent",
                  borderBottom: priorityFilter === p
                    ? `2px solid ${p === "all" ? "#c8ff00" : PRIORITY_META[p].color}`
                    : "2px solid transparent",
                }}
              >{p === "all" ? "All Priority" : PRIORITY_META[p].label}</button>
            ))}
          </div>
        </div>

        {/* ── Task List ── */}
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {filtered.length === 0 && (
            <div style={s.empty}>
              <span style={{ fontSize:32 }}>✦</span>
              <p style={{ color:"#333", fontFamily:"'DM Mono',monospace", fontSize:13 }}>
                No tasks here. Add one above.
              </p>
            </div>
          )}

          {filtered.map(task => {
            const meta    = PRIORITY_META[task.priority] || PRIORITY_META.medium;
            const overdue = !task.completed && isOverdue(task.dueDate, task.dueTime);

            return (
              <div key={task.id} className="task-row" style={s.taskRow}>
                {/* Priority stripe */}
                <div style={{ width:3, background:meta.color, borderRadius:2, flexShrink:0, alignSelf:"stretch" }} />

                {/* Checkbox */}
                <div
                  className="checkbox"
                  onClick={() => toggleTask(task.id)}
                  style={{
                    ...s.checkbox,
                    background:  task.completed ? "#c8ff00" : "transparent",
                    borderColor: task.completed ? "#c8ff00" : "#333",
                  }}
                >
                  {task.completed && <span style={{ color:"#000", fontSize:12, fontWeight:700 }}>✓</span>}
                </div>

                {/* Content */}
                <div style={{ flex:1, minWidth:0 }}>
                  {editId === task.id ? (
                    <input
                      style={s.editInput}
                      value={editText}
                      onChange={e => setEditText(e.target.value)}
                      onKeyDown={e => {
                        if (e.key === "Enter")  saveEdit(task.id);
                        if (e.key === "Escape") { setEditId(null); setEditText(""); }
                      }}
                      autoFocus
                    />
                  ) : (
                    <p
                      onDoubleClick={() => { setEditId(task.id); setEditText(task.text); }}
                      style={{
                        ...s.taskText,
                        textDecoration: task.completed ? "line-through" : "none",
                        color:          task.completed ? "#444" : "#e0e0e0",
                      }}
                    >{task.text}</p>
                  )}

                  <div style={{ display:"flex", gap:8, alignItems:"center", marginTop:4 }}>
                    <span style={{ ...s.tag, color:meta.color, background:meta.bg }}>
                      {meta.label}
                    </span>
                    {task.dueDate && (
                      <span style={{ ...s.dateTag, color: overdue ? "#f87171" : "#666" }}>
                        {overdue ? "⚠ " : ""}{formatDateTime(task.dueDate, task.dueTime)}
                      </span>
                    )}
                  </div>
                </div>

                {/* Actions */}
                <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                  {editId === task.id ? (
                    <button style={s.saveBtn} onClick={() => saveEdit(task.id)}>Save</button>
                  ) : (
                    <button
                      className="del-btn"
                      style={s.editBtn}
                      onClick={() => { setEditId(task.id); setEditText(task.text); }}
                      title="Edit task"
                    >✎</button>
                  )}
                  <button
                    className="del-btn"
                    style={s.deleteBtn}
                    onClick={() => deleteTask(task.id)}
                    title="Delete task"
                  >✕</button>
                </div>
              </div>
            );
          })}
        </div>

        {/* ── Footer ── */}
        {completedCount > 0 && (
          <div style={{ marginTop:16, display:"flex", justifyContent:"flex-end" }}>
            <button className="clear-btn" style={s.clearBtn} onClick={clearCompleted}>
              Clear {completedCount} completed
            </button>
          </div>
        )}

      </div>
    </div>
  );
}

// ── styles ───────────────────────────────────────────────────────────────────

const s = {
  page: {
    minHeight: "100vh",
    background: "#0a0a0a",
    display: "flex",
    alignItems: "flex-start",
    justifyContent: "center",
    padding: "40px 16px 80px",
    fontFamily: "'Syne', sans-serif",
  },
  container: { width: "100%", maxWidth: 620 },
  header:    { marginBottom: 28 },
  headerTop: { display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:6, flexWrap:"wrap", gap:8 },
  logo: { fontSize:28, fontWeight:800, color:"#c8ff00", letterSpacing:"0.05em" },
  chip: {
    fontFamily: "'DM Mono', monospace",
    fontSize: 12,
    color: "#555",
    background: "#111",
    padding: "4px 10px",
    borderRadius: 99,
    border: "1px solid #1e1e1e",
  },
  sub: { fontFamily:"'DM Mono', monospace", fontSize:13, color:"#3a3a3a", letterSpacing:"0.05em" },

  notifBanner: {
    display: "flex",
    alignItems: "center",
    justifyContent: "space-between",
    flexWrap: "wrap",
    gap: 12,
    background: "#141400",
    border: "1px solid #2a2a00",
    borderRadius: 10,
    padding: "12px 16px",
    marginBottom: 16,
  },
  enableBtn: {
    background: "#c8ff00",
    color: "#000",
    border: "none",
    borderRadius: 8,
    padding: "8px 16px",
    fontFamily: "'DM Mono', monospace",
    fontWeight: 700,
    fontSize: 12,
    cursor: "pointer",
    whiteSpace: "nowrap",
  },

  form: {
    background: "#111",
    border: "1px solid #1e1e1e",
    borderRadius: 12,
    padding: 16,
    marginBottom: 16,
    display: "flex",
    flexDirection: "column",
    gap: 12,
  },
  mainInput: {
    flex: 1,
    background: "#0a0a0a",
    border: "1px solid #222",
    borderRadius: 8,
    padding: "10px 14px",
    color: "#e0e0e0",
    fontSize: 15,
    fontFamily: "'Syne', sans-serif",
    transition: "border-color 0.2s",
  },
  addBtn: {
    background: "#c8ff00",
    color: "#000",
    border: "none",
    borderRadius: 8,
    padding: "10px 18px",
    fontFamily: "'Syne', sans-serif",
    fontWeight: 700,
    fontSize: 14,
    cursor: "pointer",
    whiteSpace: "nowrap",
    transition: "background 0.15s",
  },
  dateInput: {
    background: "#0a0a0a",
    border: "1px solid #222",
    borderRadius: 8,
    padding: "7px 12px",
    color: "#888",
    fontSize: 13,
    fontFamily: "'DM Mono', monospace",
    cursor: "pointer",
    transition: "border-color 0.2s",
  },
  priorityBtn: {
    border: "1px solid",
    borderRadius: 6,
    padding: "6px 12px",
    fontSize: 12,
    fontFamily: "'DM Mono', monospace",
    fontWeight: 500,
    cursor: "pointer",
    transition: "all 0.15s",
  },

  filters: {
    display: "flex",
    justifyContent: "space-between",
    alignItems: "center",
    flexWrap: "wrap",
    gap: 8,
    marginBottom: 16,
    paddingBottom: 12,
    borderBottom: "1px solid #141414",
  },
  filterBtn: {
    border: "none",
    padding: "6px 12px",
    fontSize: 12,
    fontFamily: "'DM Mono', monospace",
    cursor: "pointer",
    borderRadius: 6,
    transition: "all 0.15s",
    background: "transparent",
  },

  taskRow: {
    display: "flex",
    alignItems: "center",
    gap: 12,
    background: "#111",
    border: "1px solid #1a1a1a",
    borderRadius: 10,
    padding: "12px 14px",
  },
  checkbox: {
    width: 20,
    height: 20,
    border: "2px solid",
    borderRadius: 5,
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    flexShrink: 0,
    transition: "all 0.15s",
  },
  taskText: {
    fontSize: 15,
    fontFamily: "'Syne', sans-serif",
    wordBreak: "break-word",
    cursor: "text",
    lineHeight: 1.4,
  },
  tag: {
    fontSize: 10,
    fontFamily: "'DM Mono', monospace",
    fontWeight: 500,
    padding: "2px 7px",
    borderRadius: 4,
    textTransform: "uppercase",
    letterSpacing: "0.08em",
  },
  dateTag: {
    fontSize: 11,
    fontFamily: "'DM Mono', monospace",
  },
  editInput: {
    background: "#0a0a0a",
    border: "1px solid #c8ff00",
    borderRadius: 6,
    padding: "4px 10px",
    color: "#e0e0e0",
    fontSize: 14,
    fontFamily: "'Syne', sans-serif",
    width: "100%",
  },
  editBtn:   { background:"transparent", border:"none", color:"#555", fontSize:14, cursor:"pointer", padding:"4px 6px" },
  saveBtn:   { background:"#c8ff00", border:"none", color:"#000", fontSize:11, fontWeight:700, fontFamily:"'DM Mono',monospace", cursor:"pointer", padding:"4px 10px", borderRadius:5 },
  deleteBtn: { background:"transparent", border:"none", color:"#f87171", fontSize:13, cursor:"pointer", padding:"4px 6px" },

  empty: { display:"flex", flexDirection:"column", alignItems:"center", gap:12, padding:"48px 0", color:"#2a2a2a" },

  clearBtn: {
    background: "transparent",
    border: "1px solid #222",
    color: "#555",
    fontSize: 12,
    fontFamily: "'DM Mono', monospace",
    cursor: "pointer",
    padding: "6px 14px",
    borderRadius: 6,
    transition: "all 0.15s",
  },
};

// ── mount ─────────────────────────────────────────────────────────────────────

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TodoApp />);
</script>
</body>
</html>
